<div class="poll-creator p-3 rounded-3" style="background: var(--card-hover);">
    <h6 class="mb-3">Create a Poll</h6>

    <!-- Poll Title -->
    <div class="mb-3">
        <input type="text" name="poll_title" class="form-control" placeholder="Poll title (required)" maxlength="500" required>
    </div>

    <!-- Poll Type & Duration -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Poll Type</label>
            <select name="poll_type" class="form-select">
                <option value="single_choice">Single Choice</option>
                <option value="multiple_choice">Multiple Choice</option>
                <option value="ranked">Ranked Choice</option>
                <option value="quiz">Quiz</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Duration (hours)</label>
            <select name="poll_duration" class="form-select">
                <option value="1">1 hour</option>
                <option value="3">3 hours</option>
                <option value="6">6 hours</option>
                <option value="12">12 hours</option>
                <option value="24" selected>24 hours</option>
                <option value="48">48 hours</option>
                <option value="72">3 days</option>
                <option value="168">7 days</option>
            </select>
        </div>
    </div>

    <!-- Configuration limits (hidden, can be dynamic later) -->
    <input type="hidden" name="max_questions" id="max_questions" value="4">
    <input type="hidden" name="max_options_per_question" id="max_options_per_question" value="4">

    <!-- Questions Container -->
    <div id="questions-container">
        <!-- Question 1 will be added by JavaScript -->
    </div>

    <!-- Add Question Button -->
    <div class="text-center mb-3">
        <button type="button" class="btn btn-outline-primary" id="add-question">+ Add Question</button>
        <small class="text-muted d-block">Max 4 questions, each with 2‑4 options</small>
    </div>
</div>

<script>
    (function() {
        // Ensure the script runs only once and doesn't conflict with other toggles
        if (window.pollCreatorInitialized) return;
        window.pollCreatorInitialized = true;

        let questionCount = 0;
        const MAX_QUESTIONS = 4;
        const MAX_OPTIONS = 4;

        const container = document.getElementById('questions-container');

        // Helper to create a new question element
        function createQuestion(qnum) {
            const div = document.createElement('div');
            div.className = 'question-card mb-4 p-3 border rounded';
            div.dataset.qnum = qnum;
            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6>Question ${qnum}</h6>
                    <button type="button" class="btn btn-sm btn-outline-danger remove-question" ${qnum === 1 ? 'disabled style="visibility:hidden;"' : ''}>×</button>
                </div>
                <div class="mb-2">
                    <input type="text" name="question_${qnum}_text" class="form-control" placeholder="Question text" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Options (min 2, max 4)</label>
                    <div class="options-container" data-qnum="${qnum}"></div>
                    <button type="button" class="btn btn-sm btn-outline-primary add-option" data-qnum="${qnum}">Add Option</button>
                </div>
            `;
            return div;
        }

        // Helper to add an option to a question
        function addOptionToQuestion(qnum, container) {
            const optContainer = container.querySelector(`.options-container[data-qnum="${qnum}"]`);
            if (!optContainer) return;
            const currentOptions = optContainer.querySelectorAll('.option-item').length;
            if (currentOptions >= MAX_OPTIONS) {
                alert(`Maximum ${MAX_OPTIONS} options per question.`);
                return;
            }
            const optionDiv = document.createElement('div');
            optionDiv.className = 'option-item d-flex align-items-center mb-2';
            optionDiv.innerHTML = `
                <input type="text" name="question_${qnum}_options[]" class="form-control form-control-sm me-2" placeholder="Option ${currentOptions + 1}" required>
                <button type="button" class="btn btn-sm btn-outline-danger remove-option">×</button>
            `;
            optContainer.appendChild(optionDiv);
        }

        // Initialize first question
        function initFirstQuestion() {
            questionCount = 1;
            const q1 = createQuestion(1);
            container.appendChild(q1);
            // Add two default options
            addOptionToQuestion(1, q1);
            addOptionToQuestion(1, q1);
        }

        // Add a new question
        document.getElementById('add-question').addEventListener('click', function() {
            if (questionCount >= MAX_QUESTIONS) {
                alert('Maximum 4 questions allowed.');
                return;
            }
            questionCount++;
            const newQ = createQuestion(questionCount);
            container.appendChild(newQ);
            // Add two default options
            addOptionToQuestion(questionCount, newQ);
            addOptionToQuestion(questionCount, newQ);
            // Update remove buttons visibility
            updateRemoveButtons();
        });

        // Remove question
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-question')) {
                const questionCard = e.target.closest('.question-card');
                if (questionCard && questionCount > 1) {
                    questionCard.remove();
                    questionCount--;
                    renumberQuestions();
                }
            }
        });

        // Add option (delegation)
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('add-option')) {
                const qnum = e.target.dataset.qnum;
                const questionCard = e.target.closest('.question-card');
                if (questionCard) {
                    addOptionToQuestion(qnum, questionCard);
                }
            }
        });

        // Remove option
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-option')) {
                const optionItem = e.target.closest('.option-item');
                const optContainer = optionItem.closest('.options-container');
                const qnum = optContainer.dataset.qnum;
                const currentOptions = optContainer.querySelectorAll('.option-item').length;
                if (currentOptions <= 2) {
                    alert('At least 2 options required.');
                    return;
                }
                optionItem.remove();
            }
        });

        // Renumber questions after deletion
        function renumberQuestions() {
            const questionCards = document.querySelectorAll('.question-card');
            questionCards.forEach((card, idx) => {
                const newNum = idx + 1;
                card.dataset.qnum = newNum;
                // Update heading
                card.querySelector('h6').textContent = `Question ${newNum}`;
                // Update input names
                const qInput = card.querySelector('input[name^="question_"]');
                if (qInput && qInput.name.includes('_text')) {
                    qInput.name = `question_${newNum}_text`;
                }
                // Update option names
                const options = card.querySelectorAll('input[name^="question_"]');
                options.forEach(opt => {
                    if (opt.name.includes('_options[]')) {
                        opt.name = `question_${newNum}_options[]`;
                    }
                });
                // Update add-option button data-qnum
                const addBtn = card.querySelector('.add-option');
                if (addBtn) addBtn.dataset.qnum = newNum;
            });
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const removeButtons = document.querySelectorAll('.remove-question');
            removeButtons.forEach((btn, idx) => {
                if (idx === 0) {
                    btn.disabled = true;
                    btn.style.visibility = 'hidden';
                } else {
                    btn.disabled = false;
                    btn.style.visibility = 'visible';
                }
            });
        }

        // Start with first question
        initFirstQuestion();
    })();
</script>
