{% extends "base.html" %}

{% block title %}Edit Post - Chatter{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card glass-effect">
                <div class="card-header">
                    <h4>Edit Post</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}" enctype="multipart/form-data">
                        <!-- Content -->
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea name="content" id="content" class="form-control" rows="4" maxlength="280" required>{{ post.content }}</textarea>
                            <small class="text-muted">{{ post.content|length }}/280</small>
                        </div>

                        <!-- Existing Images (with delete checkboxes) -->
                        {% if post.media.count() > 0 %}
                        <div class="mb-3">
                            <label class="form-label">Current Images (check to delete)</label>
                            <div class="row g-2">
                                {% for media in post.media %}
                                <div class="col-6 col-md-3">
                                    <div class="position-relative border rounded p-2 text-center">
                                        <img src="{{ url_for('static', filename='uploads/posts/' + media.media_url) }}" 
                                             alt="Post image" 
                                             class="img-fluid rounded"
                                             style="height: 100px; object-fit: cover;">
                                        <div class="form-check mt-2">
                                            <input class="form-check-input" type="checkbox" name="delete_images" value="{{ media.id }}" id="del-{{ media.id }}">
                                            <label class="form-check-label small" for="del-{{ media.id }}">
                                                Delete
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                        {% endif %}

                        <!-- Upload New Images -->
                        <div class="mb-3">
                            <label for="images" class="form-label">Add New Images (max 4 total)</label>
                            <input type="file" class="form-control" name="images" id="images" accept="image/*" multiple>
                            <small class="text-muted">You can upload up to 4 images in total.</small>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('view_post', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
